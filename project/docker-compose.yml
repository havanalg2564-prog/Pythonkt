services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - postgresData:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  celeryWorker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - .env.docker
    depends_on:
      - redis

volumes:
  postgresData: